name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: make test
      - name: VM lane gate
        run: make lane-check
      - name: layer interpretation gate
        run: make layers-check
      - name: install experiment dependency
        run: python3 -m pip install --quiet numpy
      - name: routed LUT model gate
        run: make lut-check
      - name: self-modifying regime gate
        run: make regime-check
      - name: M1 model gate
        run: make model-check
      - name: M2a context gate
        run: make model-ctx-check
      - name: shard merge gate
        run: make shard-check
      - name: signed shard group gate
        run: make shard2-check
      - name: shard -> typed slot gate
        run: make shard-slot-check
      - name: continuous code pipeline gate
        run: make continuous-check
      - name: full-stream evaluation gate
        run: make eval-check
      - name: multi-order mixer smoke gate
        run: make mixer-check
      - name: bit-plane page packer gate
        run: make pack-check
      - name: 8-byte / 16-slot student gate
        run: make slot8-check
      - name: teacher shard gate
        run: make teacher-check
      - name: teacher -> slot gate
        run: make teacher-slot-check
      - name: simplex slot memory gate
        run: make model-slot-check
      - name: byte-level LM gate
        run: make model-lm-check
